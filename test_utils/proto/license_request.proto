// License request proto for YTS.
edition = "2024";

package video.youtube.testing.ytlr_cert.yts.test_modules.web_tests.lib.proto;

option features.utf8_validation = NONE;

message Message {
  int32 id = 1;
  bytes msg = 2;
}

message LicenseRequest {
  RequestInfo request_info = 1;
  RequestId request_id = 8;
}

message RequestInfo {
  message Info {
    string key = 1;
    string value = 2;
  }

  repeated Info info = 3;
}

message RequestId {
  bytes id = 3;
}
